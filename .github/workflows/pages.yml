name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Check both sources every six hours; publish only when chart data changes.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep the live data as a fallback
        run: |
          mkdir -p public/data
          for source in aa cursorbench; do
            curl -fsSL "https://jeinn-co.github.io/ai-model-compare/data/$source.json" -o "public/data/$source.json" \
              || rm -f "public/data/$source.json"
          done
      - name: Check both sources for changes
        id: snapshot
        run: npm run snapshot
      - name: Decide whether to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.snapshot.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$DATA_CHANGED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No chart data changed. Skipping package installation, build and deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore the website built for this commit
        if: steps.publish.outputs.publish == 'true'
        id: site
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: pages-site-${{ runner.os }}-${{ github.sha }}
      - name: Install build dependencies
        if: steps.publish.outputs.publish == 'true' && steps.site.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build the website when no matching build is cached
        if: steps.publish.outputs.publish == 'true' && steps.site.outputs.cache-hit != 'true'
        run: npm run build
        env:
          BASE_PATH: /ai-model-compare/
      - name: Cache the website build
        if: steps.publish.outputs.publish == 'true' && steps.site.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: pages-site-${{ runner.os }}-${{ github.sha }}
      - name: Copy the current snapshots into the website
        if: steps.publish.outputs.publish == 'true'
        run: |
          mkdir -p dist/data
          cp public/data/aa.json public/data/cursorbench.json dist/data/
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
